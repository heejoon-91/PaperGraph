[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "papergraph"
version = "0.1.0"
description = "Research paper summarization + knowledge graph generator"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "PaperGraph Team" }]
dependencies = ["pypdf>=5.0"]

[project.scripts]
papergraph = "papergraph.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]
